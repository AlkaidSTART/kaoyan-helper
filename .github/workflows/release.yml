name: Release Pipeline

# 版本号变更（pubspec.yaml 的 version）推送到 main 时，自动构建四平台安装包并发布 Release。
# 仅构建根目录 Flutter 应用；admin/ 不产安装包，其变更不会命中 paths 过滤。

on:
  push:
    branches: [ main ]
    paths:
      - 'pubspec.yaml'
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  # 可选：仓库 Settings → Secrets and variables → Actions → Variables 中配置
  # API_BASE_URL 后，所有安装包将注入该地址；未配置时沿用 ApiConfig 默认值。
  API_BASE_URL: ${{ vars.API_BASE_URL }}

jobs:
  version-check:
    name: Check Version Bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-release: ${{ steps.guard.outputs.should-release }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read Version From pubspec.yaml
        id: version
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*$//')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pubspec version: $VERSION"

      - name: Guard Against Duplicate Release
        id: guard
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "Tag v${{ steps.version.outputs.version }} already exists, skip release."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v${{ steps.version.outputs.version }} not found, start release."
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    name: Build Android APK
    needs: version-check
    if: needs.version-check.outputs.should-release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          ARGS=()
          if [ -n "$API_BASE_URL" ]; then ARGS+=(--dart-define=API_BASE_URL="$API_BASE_URL"); fi
          flutter build apk --release "${ARGS[@]}"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Exe
    needs: version-check
    if: needs.version-check.outputs.should-release == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        shell: pwsh
        run: |
          $buildArgs = @()
          if ($env:API_BASE_URL) { $buildArgs += "--dart-define=API_BASE_URL=$($env:API_BASE_URL)" }
          flutter build windows --release @buildArgs

      - name: Package Windows Portable Zip
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath kaoyan-helper-windows.zip

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: kaoyan-helper-windows.zip

  build-macos:
    name: Build macOS DMG
    needs: version-check
    if: needs.version-check.outputs.should-release == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: |
          ARGS=()
          if [ -n "$API_BASE_URL" ]; then ARGS+=(--dart-define=API_BASE_URL="$API_BASE_URL"); fi
          flutter build macos --release "${ARGS[@]}"

      - name: Create DMG
        run: |
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)"
          echo "App bundle: $APP_PATH"
          hdiutil create -volname "Kaoyan Helper" -srcfolder "$APP_PATH" -ov -format UDZO kaoyan-helper-macos.dmg

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: kaoyan-helper-macos.dmg

  build-ios:
    name: Build iOS IPA (Unsigned)
    needs: version-check
    if: needs.version-check.outputs.should-release == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Archive
        run: |
          ARGS=()
          if [ -n "$API_BASE_URL" ]; then ARGS+=(--dart-define=API_BASE_URL="$API_BASE_URL"); fi
          flutter build ipa --release --no-codesign "${ARGS[@]}"

      - name: Package Unsigned IPA
        run: |
          APP_PATH="$(find build/ios/archive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)"
          echo "App bundle: $APP_PATH"
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry kaoyan-helper-ios.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: kaoyan-helper-ios.ipa

  create-release:
    name: Publish GitHub Release
    needs: [ version-check, build-android, build-windows, build-macos, build-ios ]
    if: needs.version-check.outputs.should-release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Rename Release Assets
        run: |
          V="${{ needs.version-check.outputs.version }}"
          mv release-assets/app-release.apk           "release-assets/kaoyan-helper-v${V}-android.apk"
          mv release-assets/kaoyan-helper-windows.zip "release-assets/kaoyan-helper-v${V}-windows.zip"
          mv release-assets/kaoyan-helper-macos.dmg   "release-assets/kaoyan-helper-v${V}-macos.dmg"
          mv release-assets/kaoyan-helper-ios.ipa     "release-assets/kaoyan-helper-v${V}-ios.ipa"
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
